[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trida-mlx"
version = "0.1.0"
description = "On-device (Apple Silicon / MLX) self-speculative decoding, OpenAI server and agent for Trida2.0-4B"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Trillion Labs" }]
dependencies = [
  # Metal build on macOS; the CPU build elsewhere (Linux, no GPU).
  "mlx>=0.29; sys_platform == 'darwin'",
  "mlx[cpu]>=0.29; sys_platform == 'linux'",
  "mlx-lm>=0.31",          # Qwen3.5 gated-delta model + Metal kernel we build on
  "transformers>=4.57",    # tokenizer + chat template (tools / enable_thinking)
  "huggingface-hub",
]

[project.scripts]
trida-mlx-server = "trida_mlx.server:main"
trida-mlx-agent = "trida_mlx.agent:main"
trida-mlx-convert = "trida_mlx.convert:main"
trida-mlx-verify = "trida_mlx.verify:main"
trida-mlx-bench = "trida_mlx.bench:main"
trida-mlx-profile = "trida_mlx.profile:main"

[tool.setuptools]
packages = ["trida_mlx"]

[tool.uv]
# resolve only for the platforms this package runs on
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux'"]
