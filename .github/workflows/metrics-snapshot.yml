name: Metrics snapshot

on:
  schedule:
    # Every Monday, 01:20 UTC. Weekly during the observation period: Lv3 wants the same
    # measurement over at least two periods with a decision attached, and a quantity you
    # check monthly takes a quarter to show you the collection itself is wrong. Drops to
    # monthly once a 90-day baseline exists. Weekly also stays inside the 14-day window
    # GitHub's traffic API retains.
    - cron: "20 1 * * 1"
  workflow_dispatch:
    inputs:
      period:
        description: "Period to (re)collect, e.g. 2026-W42. Blank = the current ISO week."
        required: false

permissions:
  contents: write     # commits the snapshot
  issues: read
  pull-requests: read

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Collect and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/collect_metrics.py ${{ inputs.period && format('--period {0}', inputs.period) || '' }}

      - name: Commit the snapshot
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/snapshots
          # Re-running in the same month is a no-op rather than an empty commit.
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore(metrics): snapshot $(ls -t metrics/snapshots | head -1 | sed 's/.json//')"
          git push
