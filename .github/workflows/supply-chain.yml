name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Dependencies and upstreams rot even when this repository does not change.
    #
    # 21:37 UTC Sunday == 06:37 Monday in Asia/Seoul. The odd minute and the
    # off-peak hour are both deliberate: GitHub queues scheduled runs and drops
    # them under load, and the top of the hour is the worst moment to ask. On
    # "0 3" this job started 13-24 minutes late every week.
    - cron: "37 21 * * 0"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-drift:
    name: Pinned-commit drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # The PolyForm-NC kernels are fetched at build time, so no dependency scanner
      # sees them and we describe them by hand. This fails when that hand-written
      # record drifts from what fetch_kernels.sh actually checks out.
      - run: python tools/check_supply_chain.py
      # The workflows are a supply chain too. A tag is a pointer upstream can move,
      # and the actions that build our SBOM and sign our attestation are exactly the
      # ones a reader is trusting.
      - run: python tools/check_action_pins.py

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      - run: pip install pip-audit==2.7.3 pyyaml
      # pip-audit reports; the policy gate decides. Findings must be fixed or carry an
      # unexpired entry in docs/supply-chain/exceptions.md -- see that file for why this
      # is not a `continue-on-error` scan.
      - name: Scan declared dependencies
        run: |
          pip-audit -r requirements.txt -f json -o audit-core.json || true
          pip-audit -r inference/zoro-1/requirements.txt -f json -o audit-inference.json || true
      # The GravityOCR server environment is committed as a resolved lock for Python 3.12.
      # --no-deps --disable-pip audits those pins as written instead of resolving them, so
      # the runner's 3.10 does not matter. The gate reads a missing report as clean, and a
      # scan that cannot run writes none, so a missing or empty report fails here.
      - name: Scan the GravityOCR server lock
        run: |
          pip-audit -r inference/gravityocr/sglang/requirements-lock.txt --no-deps --disable-pip \
            -f json -o audit-gravityocr-server.json || true
          test -s audit-gravityocr-server.json || {
            echo "pip-audit wrote no report for inference/gravityocr/sglang/requirements-lock.txt"
            exit 1
          }
      - name: Enforce the exception policy
        run: |
          python tools/check_advisories.py --pip-audit audit-core.json
          python tools/check_advisories.py --pip-audit audit-inference.json
          python tools/check_advisories.py --pip-audit audit-gravityocr-server.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: pip-audit-${{ github.run_id }}
          path: audit-*.json
          retention-days: 90

  fetch-recipe:
    name: Third-party fetch recipe
    # Needs network and clones an upstream repository, so it runs weekly rather than
    # on every push. The recipes ARE the install path for both two-stream code paths:
    # if upstream moves, nobody can build.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      - run: bash tools/verify_fetch.sh
