name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Dependencies and upstreams rot even when this repository does not change.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-drift:
    name: Pinned-commit drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The PolyForm-NC kernels are fetched at build time, so no dependency scanner
      # sees them and we describe them by hand. This fails when that hand-written
      # record drifts from what fetch_kernels.sh actually checks out.
      - run: python tools/check_supply_chain.py

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pip-audit==2.7.3 pyyaml
      # pip-audit reports; the policy gate decides. Findings must be fixed or carry an
      # unexpired entry in docs/supply-chain/exceptions.md -- see that file for why this
      # is not a `continue-on-error` scan.
      - name: Scan declared dependencies
        run: |
          pip-audit -r requirements.txt -f json -o audit-core.json || true
          pip-audit -r inference/requirements.txt -f json -o audit-inference.json || true
      - name: Enforce the exception policy
        run: |
          python tools/check_advisories.py --pip-audit audit-core.json
          python tools/check_advisories.py --pip-audit audit-inference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-${{ github.run_id }}
          path: audit-*.json
          retention-days: 90

  fetch-recipe:
    name: Third-party fetch recipe
    # Needs network and clones an upstream repository, so it runs weekly rather than
    # on every push. The recipes ARE the install path for both two-stream code paths:
    # if upstream moves, nobody can build.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: bash tools/verify_fetch.sh

  model-card:
    name: Published model card
    # The repository makes claims about a model it does not contain, and those claims
    # drift silently -- the model went public on 2026-09-19 and five files still told
    # users to authenticate, because nothing was watching.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python tools/check_model_card.py
