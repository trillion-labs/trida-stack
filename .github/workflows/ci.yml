name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository. The workflow-evals job also runs third-party
# setup code (the pinned upstream's locked dependencies and their build backends).
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # Pinned to match .pre-commit-config.yaml; rule set lives in pyproject [tool.ruff.lint].
      - name: Install ruff
        run: pip install ruff==0.9.10
      - name: ruff check
        run: ruff check .
      # `ruff format --check` is not enforced yet (existing files predate the formatter).

  test:
    name: CPU tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # CPU-only: install a CPU torch wheel and pytest, and register the package
      # without its heavy CUDA-pinned deps (requirements.txt targets a GPU cluster).
      # The CPU-safe tests below only need `torch` (CPU) and the local `serve`
      # module; a GPU is not required.
      - name: Install CPU deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
          # train/test_stream_pack.py reaches train.data.text_sft_data, whose module-level
          # import chain ends at `transformers` (via train.models.block_diffusion). It is CPU-only
          # and pulls no model, but it is not in the default install because requirements.txt
          # targets a GPU cluster and is skipped by --no-deps below.
          pip install transformers
          # inference/zoro-1/test_decide_cpu.py: image requests need Pillow, the /v1/decide handler test
          # needs FastAPI's TestClient (httpx); both skip without them.
          pip install pillow fastapi httpx
          pip install -e . --no-deps
      - name: Run CPU-safe tests
        # No paths here on purpose: pytest ignores `testpaths` whenever paths are passed on
        # the command line, so a test added to pyproject.toml but not to this list would be
        # registered and never run. `pyproject.toml` is the single list.
        run: pytest -q

  demos:
    name: Demo tests (demo/zoro-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.7
      # Each demo has its own locked environment, so it is tested on its own, not in the root `pytest -q`.
      # PYTHONPATH puts Zoro-1's request parser (inference/zoro-1/decide_request.py) on the path: the demos'
      # parser tests skip without it, and here they must run, so a change to the request format that breaks
      # a demo fails this job.
      - name: Run each demo's tests against Zoro-1's request parser
        env:
          PYTHONPATH: ${{ github.workspace }}/inference/zoro-1
        run: |
          set -euo pipefail
          for d in demo/zoro-1/*/; do
            [ -f "$d/pyproject.toml" ] || continue
            echo "::group::$d"
            (cd "$d" && uv run --frozen --extra test pytest -q -rs) | tee pytest.out
            echo "::endgroup::"
            if grep -q 'SKIPPED.*decide_request' pytest.out; then
              echo "::error::$d skipped its parser tests: decide_request is not importable"; exit 1
            fi
          done

  workflow-evals:
    name: WorkflowEvals adapter (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false   # setup.sh runs third-party code; keep the token off disk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.7
      - name: Set up pinned upstream and locked dependencies
        run: benchmark/workflow_evals/setup.sh
      - name: Offline adapter and setup tests (no model or datasets)
        run: |
          benchmark/workflow_evals/.upstream/.venv/bin/python benchmark/workflow_evals/test_provider.py
          bash -n benchmark/workflow_evals/setup.sh benchmark/workflow_evals/run.sh

  decision-patches:
    name: Decision readout patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - name: Apply both overlays to the pinned fork
        run: |
          pin=$(sed -n 's/.*HYBRIDDIFFUSION_COMMIT:-\([0-9a-f]*\).*/\1/p' train/block_gated_delta_rule/fetch_kernels.sh)
          git clone --quiet --filter=blob:none --no-checkout https://github.com/yuchen-zhu-zyc/HybridDiffusion "$RUNNER_TEMP/decision-fork"
          git -C "$RUNNER_TEMP/decision-fork" checkout --quiet "$pin"
          for overlay in two_stream_diffusion.patch decision_readout.patch; do
            git -C "$RUNNER_TEMP/decision-fork" apply --check "$GITHUB_WORKSPACE/inference/zoro-1/sglang/$overlay"
            git -C "$RUNNER_TEMP/decision-fork" apply "$GITHUB_WORKSPACE/inference/zoro-1/sglang/$overlay"
          done
          python3 -m py_compile "$RUNNER_TEMP/decision-fork/eval/sglang/srt/layers/logits_processor.py" "$RUNNER_TEMP/decision-fork/eval/sglang/srt/dllm/mixin/scheduler.py"
