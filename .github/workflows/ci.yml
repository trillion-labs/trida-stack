name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # Pinned to match .pre-commit-config.yaml; rule set lives in pyproject [tool.ruff.lint].
      - name: Install ruff
        run: pip install ruff==0.9.10
      - name: ruff check
        run: ruff check .
      # `ruff format --check` is not enforced yet (existing files predate the formatter).

  test:
    name: CPU tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # CPU-only: install a CPU torch wheel and pytest, and register the package
      # without its heavy CUDA-pinned deps (requirements.txt targets a GPU cluster).
      # The CPU-safe tests below only need `torch` (CPU) and the local `serve`
      # module; a GPU is not required.
      - name: Install CPU deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
          # train/test_stream_pack.py reaches train.data.text_sft_data, whose module-level
          # import chain ends at `transformers` (via train.hf_block_diffusion). It is CPU-only
          # and pulls no model, but it is not in the default install because requirements.txt
          # targets a GPU cluster and is skipped by --no-deps below.
          pip install transformers
          pip install -e . --no-deps
      - name: Run CPU-safe tests
        # No paths here on purpose: pytest ignores `testpaths` whenever paths are passed on
        # the command line, so a test added to pyproject.toml but not to this list would be
        # registered and never run. `pyproject.toml` is the single list.
        run: pytest -q
