# Rationale for these values lives in docs/supply-chain/README.md.
fail-on-severity: high
# Copyleft that would propagate into this Apache-2.0 distribution, plus source-available
# licences whose service restrictions are incompatible with how we distribute.
deny-licenses:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - SSPL-1.0
license-check: true
vulnerability-check: true
show-openssf-scorecard: true
