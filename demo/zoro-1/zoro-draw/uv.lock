version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "fastapi", version = "0.162.5", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "fastapi", version = "0.165.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "httpx" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
test = [
    { name = "pillow", version = "12.3.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "pillow", version = "13.0.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
]

[package.metadata]
requires-dist = [
    { name = "fastapi", specifier = ">=0.110" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "pillow", marker = "extra == 'test'" },
    { name = "pytest", marker = "extra == 'test'", specifier = ">=8" },
    { name = "pytest-asyncio", marker = "extra == 'test'", specifier = ">=0.23" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.29" },
]
provides-extras = ["test"]
