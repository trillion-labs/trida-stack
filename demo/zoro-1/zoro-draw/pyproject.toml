[project]
name = "zoro-draw"
version = "0.1.0"
license = {text = "Apache-2.0"}
description = "Zoro-1 demo: a multiplayer drawing game where Zoro-1 guesses your drawing"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pillow"]  # pillow: the server parser loads images

[project.scripts]
zoro-draw = "zoro_draw.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zoro_draw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
