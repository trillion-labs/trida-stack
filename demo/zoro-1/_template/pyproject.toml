[project]
name = "my-demo"                 # rename: the folder name, e.g. "zoro-tarot"
version = "0.1.0"
license = {text = "Apache-2.0"}
description = "Zoro-1 demo: <one line>"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]   # add what you need; keep it small

[project.optional-dependencies]
test = ["pytest>=8", "pillow"]  # pillow: Zoro-1's request parser loads images

[project.scripts]
my-demo = "my_demo.main:main"    # rename with the package

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_demo"]
